[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchard-vibration-solver"
version = "0.1.0"
description = "Orchard FEM framework for orchard tree vibration modeling, simulation, and validation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "scipy>=1.11",
]

[project.scripts]
orchard-fem = "orchard_fem.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]
viz = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "jupyterlab>=4.2",
]
ml = [
  "torch>=2.2",
  # EfficientFormer backbone used by orchard_vision.wood_seg.
  "timm>=1.0",
  "h5py>=3.10",
]
uq = [
  # Uncertainty-quantification stack used by the `recommend` workflow:
  # Bayesian calibration (emcee), Sobol sensitivity (SALib), progress bars.
  "emcee>=3.1",
  "SALib>=1.5",
  "tqdm>=4.66",
]
rig = [
  # DS5L1 vibration-rig serial link (orchard_fem.actuator.ds5l1 / vibration_gui).
  "pyserial>=3.5",
]
vision = [
  # Monocular tree-photo → branch skeleton front-end (orchard_vision). Pure
  # NumPy/SciPy/scikit-image, so it runs natively on a field Windows laptop.
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-image>=0.24",
  "matplotlib>=3.8",
]
ubuntu-test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scikit-image>=0.24",
  "pyyaml>=6.0",
  "jupyterlab>=4.2",
]

[tool.setuptools.packages.find]
include = ["orchard_fem*", "orchard_pinn*", "orchard_vision*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# CLI scripts insert the repo root on sys.path before importing the package, so
# module-level imports legitimately follow that bootstrap (E402).
"scripts/**" = ["E402"]
# Package __init__ files re-export the public API; those imports are intentional.
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
